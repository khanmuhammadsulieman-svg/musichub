<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Universal Video Downloader</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 520px;
      margin: 60px auto;
      padding: 24px;
      background: #0f172a;
      color: #f8fafc;
      border-radius: 12px;
    }
    h2 { margin-bottom: 8px; font-size: 1.5rem; }
    p { color: #94a3b8; font-size: 0.95rem; margin-bottom: 16px; }
    input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #fff;
      font-size: 1rem;
      box-sizing: border-box;
      margin-bottom: 12px;
      outline: none;
    }
    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #38bdf8;
      color: #0f172a;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    #status {
      margin-top: 18px;
      font-size: 0.95rem;
      text-align: center;
      min-height: 24px;
    }
    #status a {
      color: #38bdf8;
      font-weight: bold;
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <h2>Universal Video Downloader</h2>
  <p>Paste any YouTube, Instagram, TikTok, or X link:</p>

  <input type="text" id="videoUrl" placeholder="https://www.youtube.com/watch?v=..." />
  <button id="downloadBtn" onclick="downloadVideo()">Get Download Link</button>

  <div id="status"></div>

  <script>
    const API_KEY = "83ccdd7a-c6e1-4478-b05f-0ac656a719d5";

    async function downloadVideo() {
      const inputUrl = document.getElementById("videoUrl").value.trim();
      const status = document.getElementById("status");
      const btn = document.getElementById("downloadBtn");

      if (!inputUrl) {
        status.textContent = "Please enter a valid video link.";
        return;
      }

      btn.disabled = true;
      status.textContent = "Requesting download job from HuntAPI...";

      try {
        // Step 1: Submit video query to HuntAPI
        const endpoint = `https://api.huntapi.com/v1/video/download?query=${encodeURIComponent(inputUrl)}&video_quality=best&video_format=mp4&download_type=audio_video`;
        
        const response = await fetch(endpoint, {
          method: "GET",
          headers: {
            "x-api-key": API_KEY,
            "Accept": "application/json"
          }
        });

        const data = await response.json();

        // Step 2: Handle immediate download link or asynchronous job
        if (data.download_url || data.url) {
          const directUrl = data.download_url || data.url;
          status.innerHTML = `<a href="${directUrl}" target="_blank" download>Download Video</a>`;
          btn.disabled = false;
          return;
        }

        const jobId = data.job_id || data.id;
        if (!jobId) {
          status.textContent = data.message || "Failed to start download job. Please check the URL.";
          btn.disabled = false;
          return;
        }

        // Step 3: Poll the job endpoint until finished
        status.textContent = "Processing video (this may take a few seconds)...";
        const pollInterval = setInterval(async () => {
          try {
            const jobRes = await fetch(`https://api.huntapi.com/v1/jobs/${jobId}`, {
              headers: { "x-api-key": API_KEY }
            });
            const job = await jobRes.json();

            if (job.status === "CompletedJob" && (job.result?.response || job.result?.url)) {
              clearInterval(pollInterval);
              const finalUrl = job.result.response || job.result.url;
              status.innerHTML = `<a href="${finalUrl}" target="_blank" download>Click Here to Download Your Video</a>`;
              btn.disabled = false;
            } else if (job.status === "Error" || job.status === "BadRequest") {
              clearInterval(pollInterval);
              status.textContent = "Error processing video. Check if the video is public.";
              btn.disabled = false;
            }
          } catch (pollErr) {
            clearInterval(pollInterval);
            status.textContent = "Error polling video status.";
            btn.disabled = false;
          }
        }, 2500);

      } catch (err) {
        status.textContent = "Connection error. Please try again.";
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
