<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Universal Video Downloader</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 520px;
      margin: 60px auto;
      padding: 24px;
      background: #0f172a;
      color: #f8fafc;
      border-radius: 12px;
    }
    h2 { margin-bottom: 8px; font-size: 1.5rem; text-align: center; }
    p { color: #94a3b8; font-size: 0.95rem; margin-bottom: 16px; text-align: center; }
    input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #fff;
      font-size: 1rem;
      box-sizing: border-box;
      margin-bottom: 12px;
      outline: none;
    }
    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #38bdf8;
      color: #0f172a;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    #status {
      margin-top: 18px;
      font-size: 0.95rem;
      text-align: center;
      min-height: 24px;
      word-break: break-word;
    }
    #status a {
      color: #38bdf8;
      font-weight: bold;
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <h2>Universal Video Downloader</h2>
  <p>Paste any YouTube, Instagram, TikTok, or X link:</p>

  <input type="text" id="videoUrl" placeholder="https://www.youtube.com/watch?v=..." />
  <button id="downloadBtn" onclick="downloadVideo()">Get Download Link</button>

  <div id="status"></div>

  <script>
    async function downloadVideo() {
      const inputUrl = document.getElementById("videoUrl").value.trim();
      const status = document.getElementById("status");
      const btn = document.getElementById("downloadBtn");

      if (!inputUrl) {
        status.textContent = "Please enter a valid video link.";
        return;
      }

      btn.disabled = true;
      status.textContent = "Starting download job...";

      try {
        const response = await fetch(`/api/download?query=${encodeURIComponent(inputUrl)}`);
        const data = await response.json();

        // 1. Check for immediate URL in the initial response
        const directUrl = data.download_url || data.url || data.result?.url || data.result?.response;
        if (directUrl) {
          status.innerHTML = `<a href="${directUrl}" target="_blank" download>Download Video</a>`;
          btn.disabled = false;
          return;
        }

        const jobId = data.job_id || data.id;
        if (!jobId) {
          status.textContent = data.message || data.error || "Unable to start download job. Check your API key or link.";
          btn.disabled = false;
          return;
        }

        status.textContent = `Job started (ID: ${jobId}). Waiting for processing...`;

        // 2. Poll job endpoint until ready
        let attempts = 0;
        const maxAttempts = 30; // 30 * 2.5s = ~75 seconds timeout

        const pollInterval = setInterval(async () => {
          attempts++;
          try {
            const jobRes = await fetch(`/api/download?jobId=${jobId}`);
            const job = await jobRes.json();

            // Extract the download URL from whichever key HuntAPI provides
            const finalUrl =
              job.result?.response ||
              job.result?.url ||
              job.download_url ||
              job.file_url ||
              job.url;

            const jobStatus = (job.status || "").toLowerCase();

            if (finalUrl || jobStatus === "completed" || jobStatus === "finished" || jobStatus === "completedjob") {
              clearInterval(pollInterval);
              const downloadLink = finalUrl || job.result;
              status.innerHTML = `<a href="${downloadLink}" target="_blank" download>Click Here to Download Your Video</a>`;
              btn.disabled = false;
            } else if (jobStatus === "error" || jobStatus === "failed" || jobStatus === "badrequest") {
              clearInterval(pollInterval);
              status.textContent = job.error || job.message || "Failed to process video on server.";
              btn.disabled = false;
            } else {
              status.textContent = `Processing video... (Status: ${job.status || "In progress"}, ${attempts * 2}s)`;
            }

            if (attempts >= maxAttempts) {
              clearInterval(pollInterval);
              status.textContent = "Video processing timed out. Please try again with a shorter video.";
              btn.disabled = false;
            }
          } catch (pollErr) {
            clearInterval(pollInterval);
            status.textContent = "Error reading job status from server.";
            btn.disabled = false;
          }
        }, 2500);

      } catch (err) {
        status.textContent = "Connection error. Please try again.";
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
