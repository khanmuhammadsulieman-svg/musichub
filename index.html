<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ALL DOWNLOADER — By sulieman khan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --border: #e2e8f0;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      
      /* Vibrant platform brand colors */
      --yt-red: #ef4444;
      --ig-pink: #ec4899;
      --tt-black: #0f172a;
      --x-dark: #18181b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(at 0% 0%, rgba(37, 99, 235, 0.08) 0px, transparent 40%),
        radial-gradient(at 100% 100%, rgba(236, 72, 153, 0.08) 0px, transparent 40%),
        radial-gradient(at 50% 50%, rgba(245, 158, 11, 0.04) 0px, transparent 50%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 28px 16px;
    }

    .main-card {
      width: 100%;
      max-width: 620px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 40px 32px;
      box-shadow: 0 20px 45px -10px rgba(15, 23, 42, 0.08), 0 0 1px rgba(15, 23, 42, 0.05);
    }

    /* Header & Branding */
    .brand-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .logo-title {
      font-size: 2.1rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      text-transform: uppercase;
      background: linear-gradient(135deg, #1e293b 0%, #2563eb 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: inline-block;
    }

    .author-sub {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-top: 4px;
      text-decoration: underline;
      text-underline-offset: 4px;
      text-decoration-color: #3b82f6;
    }

    /* Platform Pills with Official SVGs */
    .platform-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin-bottom: 26px;
      flex-wrap: wrap;
    }

    .platform-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 14px;
      border-radius: 9999px;
      font-size: 0.78rem;
      font-weight: 700;
      border: 1px solid transparent;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      cursor: default;
    }

    .platform-pill svg {
      width: 15px;
      height: 15px;
    }

    .pill-yt {
      background: #fef2f2;
      color: #dc2626;
      border-color: #fee2e2;
    }
    .pill-ig {
      background: #fdf2f8;
      color: #db2777;
      border-color: #fce7f3;
    }
    .pill-tt {
      background: #f0fdfa;
      color: #0d9488;
      border-color: #ccfbf1;
    }
    .pill-x {
      background: #f8fafc;
      color: #0f172a;
      border-color: #e2e8f0;
    }

    .platform-pill:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
    }

    /* Input Section */
    .input-section {
      margin-bottom: 18px;
    }

    .input-box {
      width: 100%;
      padding: 15px 18px;
      background: #f8fafc;
      border: 2px solid #e2e8f0;
      border-radius: 14px;
      color: var(--text-main);
      font-size: 0.96rem;
      font-weight: 500;
      outline: none;
      transition: all 0.2s ease;
    }

    .input-box:focus {
      background: #ffffff;
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
    }

    /* Options Section */
    .options-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 22px;
    }

    .control-card {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 14px;
    }

    .control-card label {
      display: block;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    select {
      width: 100%;
      border: none;
      background: transparent;
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--text-main);
      outline: none;
      cursor: pointer;
    }

    /* Action Button */
    .submit-btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, #2563eb 0%, #4f46e5 100%);
      color: #ffffff;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 10px 20px -5px rgba(37, 99, 235, 0.4);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .submit-btn:hover {
      box-shadow: 0 14px 24px -5px rgba(37, 99, 235, 0.5);
      transform: translateY(-1px);
    }

    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    /* Loading Spinner & Status */
    #statusArea {
      margin-top: 24px;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      text-align: center;
    }

    .pulse-spinner {
      width: 32px;
      height: 32px;
      border: 3.5px solid #e2e8f0;
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    #statusText {
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    /* Result Card */
    .result-box {
      width: 100%;
      background: linear-gradient(135deg, #f0fdf4 0%, #ecfdf5 100%);
      border: 1px solid #bbf7d0;
      border-radius: 14px;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 8px;
    }

    .result-info {
      text-align: left;
    }

    .result-title {
      font-weight: 700;
      font-size: 0.95rem;
      color: #14532d;
    }

    .result-sub {
      font-size: 0.8rem;
      color: #15803d;
      font-weight: 500;
    }

    .btn-download-link {
      background: #16a34a;
      color: #ffffff;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.9rem;
      padding: 10px 20px;
      border-radius: 10px;
      box-shadow: 0 4px 12px rgba(22, 163, 74, 0.25);
      transition: background 0.2s;
    }

    .btn-download-link:hover {
      background: #15803d;
    }

    /* Footer Credits */
    footer {
      margin-top: 26px;
      text-align: center;
      font-size: 0.88rem;
      font-weight: 600;
      color: #64748b;
    }

    .heart-icon {
      color: #ef4444;
      display: inline-block;
      animation: heartbeat 1.4s infinite;
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.2); }
    }
  </style>
</head>
<body>

  <main class="main-card">
    <header class="brand-header">
      <h1 class="logo-title">ALL DOWNLOADER</h1>
      <span class="author-sub">By sulieman khan</span>
    </header>

    <div class="platform-container">
      <!-- YouTube SVG -->
      <div class="platform-pill pill-yt">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
        </svg>
        <span>YouTube</span>
      </div>

      <!-- Instagram SVG -->
      <div class="platform-pill pill-ig">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838a6.162 6.162 0 1 0 0 12.324 6.162 6.162 0 0 0 0-12.324zM12 16a4 4 0 1 1 0-8 4 4 0 0 1 0 8zm6.406-11.845a1.44 1.44 0 1 0 0 2.881 1.44 1.44 0 0 0 0-2.881z"/>
        </svg>
        <span>Instagram</span>
      </div>

      <!-- TikTok SVG -->
      <div class="platform-pill pill-tt">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.44-3.37-3.65-5.71-.02-.5-.03-1-.01-1.49.18-1.9 1.12-3.72 2.58-4.96 1.66-1.44 3.98-2.13 6.15-1.72.02 1.48-.04 2.96-.04 4.44-.99-.32-2.15-.23-3.02.37-.63.41-1.11 1.04-1.36 1.75-.21.51-.24 1.07-.14 1.61.24 1.64 1.82 3.02 3.5 2.87 1.12-.01 2.19-.66 2.77-1.61.19-.33.4-.67.41-1.06.1-1.79.06-3.57.07-5.36.01-4.03-.01-8.05.02-12.07z"/>
        </svg>
        <span>TikTok</span>
      </div>

      <!-- X / Twitter SVG -->
      <div class="platform-pill pill-x">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
        </svg>
        <span>X (Twitter)</span>
      </div>
    </div>

    <div class="input-section">
      <input type="text" id="videoUrl" class="input-box" placeholder="Paste link from YouTube, Instagram, TikTok, or X..." />
    </div>

    <div class="options-row">
      <div class="control-card">
        <label>Format</label>
        <select id="downloadType" onchange="toggleQualityOptions()">
          <option value="audio_video">Video + Audio (MP4)</option>
          <option value="audio_only">Audio Only (MP3)</option>
        </select>
      </div>

      <div class="control-card">
        <label>Resolution</label>
        <select id="videoQuality">
          <option value="best" selected>Best Available</option>
          <option value="1080">1080p (Full HD)</option>
          <option value="720">720p (HD)</option>
          <option value="480">480p (SD)</option>
          <option value="360">360p</option>
        </select>
      </div>
    </div>

    <button id="downloadBtn" class="submit-btn" onclick="startDownload()">
      <span>Download Media</span>
    </button>

    <div id="statusArea">
      <div class="pulse-spinner" id="spinner"></div>
      <div id="statusText">Connecting...</div>
      <div id="resultContainer" style="width: 100%;"></div>
    </div>
  </main>

  <footer>
    Created with <span class="heart-icon">❤️</span> by Muhammad sulieman khan
  </footer>

  <script>
    function toggleQualityOptions() {
      const type = document.getElementById("downloadType").value;
      const qualitySelect = document.getElementById("videoQuality");
      qualitySelect.disabled = (type === "audio_only");
    }

    async function startDownload() {
      const url = document.getElementById("videoUrl").value.trim();
      const quality = document.getElementById("videoQuality").value;
      const type = document.getElementById("downloadType").value;

      const statusArea = document.getElementById("statusArea");
      const statusText = document.getElementById("statusText");
      const spinner = document.getElementById("spinner");
      const resultContainer = document.getElementById("resultContainer");
      const btn = document.getElementById("downloadBtn");

      if (!url) {
        alert("Please enter a valid media link first.");
        return;
      }

      btn.disabled = true;
      statusArea.style.display = "flex";
      spinner.style.display = "block";
      resultContainer.innerHTML = "";
      statusText.style.color = "#64748b";
      statusText.textContent = "Connecting to converter...";

      try {
        const queryParams = new URLSearchParams({ query: url, quality, type });
        const res = await fetch(`/api/download?${queryParams.toString()}`);
        const data = await res.json();

        // Immediate direct download url
        const directUrl = data.download_url || data.url || data.result?.url || data.result?.response;
        if (directUrl) {
          showDownloadLink(directUrl, type);
          btn.disabled = false;
          return;
        }

        const jobId = data.job_id || data.id;
        if (!jobId) {
          showError(data.message || data.error || "Unable to process this link. Please check if it's public.");
          btn.disabled = false;
          return;
        }

        statusText.textContent = "Processing video stream...";

        let attempts = 0;
        const maxAttempts = 35; // ~75 seconds timeout

        const poll = setInterval(async () => {
          attempts++;
          try {
            const jobRes = await fetch(`/api/download?jobId=${jobId}`);
            const job = await jobRes.json();

            const finalUrl = job.result?.response || job.result?.url || job.download_url || job.file_url || job.url;
            const jobStatus = (job.status || "").toLowerCase();

            if (finalUrl || jobStatus === "completed" || jobStatus === "finished" || jobStatus === "completedjob") {
              clearInterval(poll);
              showDownloadLink(finalUrl || job.result, type);
              btn.disabled = false;
            } else if (jobStatus === "error" || jobStatus === "failed" || jobStatus === "badrequest") {
              clearInterval(poll);
              showError(job.error || job.message || "Failed to process video on server.");
              btn.disabled = false;
            } else {
              statusText.textContent = `Processing media... (${attempts * 2}s)`;
            }

            if (attempts >= maxAttempts) {
              clearInterval(poll);
              showError("Request timed out. Please try again with a shorter video.");
              btn.disabled = false;
            }
          } catch (pollErr) {
            clearInterval(poll);
            showError("Network interruption while tracking job.");
            btn.disabled = false;
          }
        }, 2200);

      } catch (err) {
        showError("Failed to communicate with download server.");
        btn.disabled = false;
      }
    }

    function showDownloadLink(fileUrl, type) {
      const spinner = document.getElementById("spinner");
      const statusText = document.getElementById("statusText");
      const resultContainer = document.getElementById("resultContainer");

      spinner.style.display = "none";
      statusText.textContent = "Your media is ready!";
      statusText.style.color = "#16a34a";

      resultContainer.innerHTML = `
        <div class="result-box">
          <div class="result-info">
            <div class="result-title">Ready for Download</div>
            <div class="result-sub">${type === 'audio_only' ? 'Audio (MP3)' : 'Video (MP4)'}</div>
          </div>
          <a href="${fileUrl}" class="btn-download-link" target="_blank" download>Download</a>
        </div>
      `;
    }

    function showError(message) {
      const spinner = document.getElementById("spinner");
      const statusText = document.getElementById("statusText");
      spinner.style.display = "none";
      statusText.style.color = "#dc2626";
      statusText.textContent = message;
    }
  </script>
</body>
</html>
